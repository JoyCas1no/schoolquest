<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-прототип боя — Школьный Квест</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd9ff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  #top { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; z-index: 5; white-space: nowrap; }
  #top b { background: rgba(26,21,53,.82); color: #fff; padding: 6px 14px; border-radius: 10px; font-size: 15px; }
  #top span { background: rgba(26,21,53,.6); color: #cfe0ff; padding: 5px 12px; border-radius: 10px; font-size: 12px; }
  #panel { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom));
    background: rgba(26,21,53,.85); border-radius: 16px; padding: 12px 14px; z-index: 5;
    display: flex; flex-direction: column; gap: 8px; width: min(560px, calc(100vw - 20px)); box-sizing: border-box; }
  #hp { color: #ffd166; font-weight: 700; text-align: center; font-size: 15px; }
  #msg { color: #e8e6ff; text-align: center; font-size: 13px; min-height: 17px; }
  #dice { color: #7dd8ff; text-align: center; font-weight: 700; font-size: 14px; min-height: 17px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { border: 0; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: #3d3670; color: #fff; cursor: pointer; flex: 1 1 auto; }
  button.on { background: #ffd166; color: #2b1d00; }
  button:disabled { opacity: .5; cursor: default; }
  #roll { background: #ff5f6d; font-size: 16px; padding: 12px; }
  #hint { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 10px; z-index: 4;
    color: rgba(255,255,255,.85); font-size: 11px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="top"><b>⚔️ 3D-прототип боя</b><span>Школьный Квест · тяните пальцем, чтобы крутить камеру</span></div>
<div id="panel">
  <div id="hp"></div>
  <div id="msg"></div>
  <div id="dice"></div>
  <div class="row" id="classes"></div>
  <div class="row">
    <button id="mprev">◀ Монстр</button>
    <button id="mnext">Монстр ▶</button>
  </div>
  <button id="roll">🎲 Бросить кубик</button>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js" } }
</script>
<script type="module" src="./src/proto3d.js?v=3"></script>
</body>
</html>
