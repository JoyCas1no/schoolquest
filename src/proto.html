<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Школьный Квест — 3D-прототип боя</title>
<style>
:root{--bg:#1b1535;--card:#2a2250;--card2:#372d6b;--ink:#f4f0ff;--dim:#b7acd9;--acc:#ffcf4a;--ok:#4ade80;--bad:#fb7185}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#c3d{position:fixed;inset:0;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#top{padding:10px 14px;text-align:center}
#top b{font-size:17px;background:rgba(26,21,53,.82);border-radius:10px;padding:3px 14px;display:inline-block}
#top .dim{font-size:13px;color:var(--dim);background:rgba(26,21,53,.7);border-radius:10px;padding:2px 12px;display:inline-block;margin-top:4px}
#panel{pointer-events:auto;background:rgba(26,21,53,.92);border-radius:18px 18px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;width:100%}
#msg{min-height:24px;text-align:center;font-size:16px;margin-bottom:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.row>*{flex:1}
button{font:inherit;color:var(--ink);background:var(--card2);border:0;border-radius:12px;padding:11px 8px;cursor:pointer}
button:active{transform:scale(.97)}
button.on{outline:3px solid var(--acc)}
button.main{background:var(--acc);color:#2b1d00;font-weight:800;font-size:18px;padding:14px}
button[disabled]{opacity:.55}
#dice{font-size:34px;font-weight:800;color:var(--acc);text-align:center;min-height:42px}
.small{font-size:13px;color:var(--dim);text-align:center;margin-top:6px}
#hp{text-align:center;font-size:20px;letter-spacing:2px;min-height:26px}
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<div id="hud">
  <div id="top"><b>⚔️ 3D-прототип боя</b><div class="dim">Школьный Квест · тяните пальцем, чтобы крутить камеру</div></div>
  <div id="panel">
    <div id="hp"></div>
    <div id="dice"></div>
    <div id="msg">Нажми «Бросить кубик»!</div>
    <div class="row" id="classes"></div>
    <div class="row">
      <button id="mprev">◀ Монстр</button>
      <button id="mnext">Монстр ▶</button>
    </div>
    <button class="main" id="roll">🎲 Бросить кубик</button>
    <div class="small">Прототип для оценки: какой стиль 3D нравится больше? Что добавить или убрать?</div>
  </div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js"}}
</script>
<script type="module" src="./src/proto3d.js"></script>
</body>
</html>
