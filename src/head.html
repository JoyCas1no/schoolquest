<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Школьный Квест</title>
<style>
:root{--bg:#1b1535;--card:#2a2250;--card2:#372d6b;--ink:#f4f0ff;--dim:#b7acd9;--acc:#ffcf4a;--ok:#4ade80;--bad:#fb7185;--blue:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:26px;margin:6px 0 4px}h2{font-size:20px;margin:14px 0 8px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.narr{background:var(--card2);border-left:5px solid var(--acc);border-radius:12px;padding:10px 12px;margin:10px 0;font-style:italic}
.narr b{font-style:normal;color:var(--acc)}
button{font:inherit;color:var(--ink);background:var(--card2);border:0;border-radius:14px;padding:13px 14px;cursor:pointer;width:100%;margin:5px 0;text-align:left}
button:active{transform:scale(.98)}
button.main{background:var(--acc);color:#2b1d00;font-weight:700;text-align:center}
button.sm{width:auto;padding:8px 12px;font-size:15px}
button[disabled]{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{text-align:center;padding:14px 8px}
.grid button span{display:block;font-size:30px}
.mon{font-size:90px;text-align:center;line-height:1.1;transition:transform .2s}
.mon.hit{animation:hit .4s}.mon.dead{transform:scale(.2) rotate(40deg);opacity:0;transition:all .8s}
@keyframes hit{0%{transform:translateX(0)}25%{transform:translateX(-14px)}75%{transform:translateX(14px)}100%{transform:translateX(0)}}
.pips{text-align:center;font-size:22px;letter-spacing:3px}
.q{font-size:20px;font-weight:600;margin:10px 0;text-align:center}
.opt.right{background:#166534}.opt.wrong{background:#9f1239}
.dice{font-size:44px;font-weight:800;text-align:center;color:var(--acc);min-height:56px}
.msg{text-align:center;min-height:24px;margin:4px 0}
.expl{background:#3b2f73;border-radius:12px;padding:10px;margin:8px 0;font-size:15px}
.bar{height:12px;background:#1b1535;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.lb div{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid #3b2f73}
.lb .me{color:var(--acc);font-weight:700}
.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.coll div{background:var(--card2);border-radius:12px;padding:8px 2px;font-size:11px}.coll span{display:block;font-size:34px}
.coll .no{opacity:.35;filter:grayscale(1)}
.dim{color:var(--dim);font-size:14px}
select{font:inherit;width:100%;padding:11px;border-radius:12px;border:0;background:var(--card2);color:var(--ink);margin:4px 0}
.toast{position:fixed;left:12px;right:12px;bottom:16px;max-width:496px;margin:auto;background:var(--acc);color:#2b1d00;padding:12px;border-radius:14px;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
