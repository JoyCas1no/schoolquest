<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Школьный Квест — Изометрия</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#101418; overflow:hidden;
    font-family:"Segoe UI", system-ui, sans-serif; -webkit-user-select:none; user-select:none;
    touch-action:none; }
  #game { display:block; width:100vw; height:100vh; }
  .hud { position:fixed; top:10px; left:10px; right:10px; display:flex; gap:10px;
    align-items:center; pointer-events:none; z-index:5; }
  .pill { background:rgba(10,14,20,.65); color:#fff; border-radius:999px; padding:8px 16px;
    font-size:18px; font-weight:600; backdrop-filter:blur(4px); }
  .btn { pointer-events:auto; background:rgba(10,14,20,.65); color:#fff; border:2px solid rgba(255,255,255,.15);
    border-radius:50%; width:48px; height:48px; font-size:20px; cursor:pointer; }
  .btn:active { transform:scale(.92); }
  .spacer { flex:1; }
  #joy { position:fixed; left:26px; bottom:26px; width:130px; height:130px; border-radius:50%;
    background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.16); z-index:6; display:none; }
  #stick { position:absolute; left:41px; top:41px; width:48px; height:48px; border-radius:50%;
    background:rgba(255,255,255,.35); }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:rgba(8,10,14,.72); z-index:10; color:#fff; text-align:center; padding:20px; }
  #overlay h1 { font-size:42px; margin:0 0 8px; text-shadow:0 4px 18px rgba(0,0,0,.6); }
  #overlay p { font-size:19px; margin:6px 0; opacity:.92; max-width:520px; }
  .bigbtn { margin-top:22px; background:#ffb300; color:#3a2500; border:none; border-radius:16px;
    padding:16px 44px; font-size:24px; font-weight:800; cursor:pointer; box-shadow:0 6px 0 #b97e00; }
  .bigbtn:active { transform:translateY(4px); box-shadow:0 2px 0 #b97e00; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="pill" id="books">✅ 0/12</div>
  <div class="pill" id="timer">0:00</div>
  <div class="pill">🔢 Математика</div>
  <div class="spacer"></div>
  <button class="btn" id="mute" title="Звук">🔊</button>
  <button class="btn" id="pause" title="Пауза">⏸</button>
</div>
<div id="joy"><div id="stick"></div></div>
<button id="action" class="bigbtn hidden" style="position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:7;">▶ Начать задание</button>
<div id="quiz" class="hidden" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.62);z-index:9;">
  <div style="background:#1c2530;border-radius:18px;padding:26px 28px;max-width:520px;width:92%;color:#fff;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);">
    <div style="font-size:15px;opacity:.8;">🔢 Математика · 1 класс</div>
    <div id="qText" style="font-size:25px;font-weight:700;margin:10px 0 18px;line-height:1.35;"></div>
    <div id="qOpts" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
    <div id="qExpl" class="hidden" style="margin-top:16px;font-size:16px;line-height:1.45;background:rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;text-align:left;"></div>
    <button id="qNext" class="bigbtn hidden" style="font-size:18px;padding:10px 32px;">Продолжить</button>
  </div>
</div>
<div id="overlay">
  <h1 id="ovTitle">Школьный Квест</h1>
  <p id="ovText">Подойди к парте и нажми «Начать задание». Сдай все 12 заданий по математике — и выходи через дверь!</p>
  <p id="ovHint">Ходьба: WASD / стрелки / джойстик · Задание: E · Пауза: P</p>
  <button class="bigbtn" id="ovBtn">Играть</button>
</div>
<script>
"use strict";
/* ============ ШКОЛЬНЫЙ КВЕСТ: ИЗОМЕТРИЯ ============
   Спрайты нарисованы нейросетью, лежат рядом: assets/iso/ */
const SPRITES = {
  hero:  ["assets/iso/hero.",  8],
  cat:   ["assets/iso/cat.",   12],
  desk:  ["assets/iso/desk.",  9],
  shelf: ["assets/iso/shelf.", 9],
};

const cv  = document.getElementById("game");
const ctx = cv.getContext("2d");
const TILE_W = 64, TILE_H = 32, WALL_H = 58;

/* ---------- карта ----------
   # стена · . пол · T парта · S шкаф · D дверь выхода */
const MAP_SRC = [
  "##################",
  "#.SS..........SS.#",
  "#...T...T...T....#",
  "#................#",
  "#...T...T...T....#",
  "#................#",
  "#................#",
  "#................#",
  "#...T...T...T....#",
  "#................#",
  "#...T...T...T....#",
  "#................#",
  "#########D########",
];
const MAP_H = MAP_SRC.length, MAP_W = MAP_SRC[0].length;
const SPAWN = { x: 2.5, y: 10.5 };

const wallAt = (x, y) => {
  if (x < 0 || y < 0 || y >= MAP_H || x >= MAP_W) return true;
  return MAP_SRC[y][x] === "#";
};
const tileAt = (x, y) => {
  if (x < 0 || y < 0 || y >= MAP_H || x >= MAP_W) return "#";
  return MAP_SRC[y][x];
};
const passable = (x, y, doorOpen) => {
  const c = tileAt(Math.floor(x), Math.floor(y));
  if (c === "#" || c === "T" || c === "S") return false;
  if (c === "D" && !doorOpen) return false;
  return true;
};

// парты с заданиями: этот класс — математика (уровень 1), все парты одного предмета,
// чтобы одновременно могли учиться много «игроков»
const desks = [];
for (let y = 0; y < MAP_H; y++)
  for (let x = 0; x < MAP_W; x++)
    if (MAP_SRC[y][x] === "T") desks.push({ x: x + 0.5, y: y + 0.5, done: false });
const TOTAL = desks.length;

/* ---------- состояние ---------- */
let state = "title";           // title | play | pause | win
let doorOpen = false;
let hero, cat, parts = [];
let camX = 0, camY = 0;
let elapsed = 0, startT = 0;
let muted = localStorage.getItem("sq_iso_mute") === "1";
let best = +(localStorage.getItem("sq_iso_best") || 0);

function resetGame() {
  hero = { x: SPAWN.x, y: SPAWN.y, vx: 0, vy: 0, face: 1, moving: false, bob: 0 };
  cat  = { x: SPAWN.x - 0.6, y: SPAWN.y + 0.4, trail: [], face: 1, bob: 0 };
  desks.forEach(d => d.done = false);
  parts = [];
  doorOpen = false;
  elapsed = 0;
  updateBooksHud();
}

/* ---------- изометрия ---------- */
const isoX = (x, y) => (x - y) * TILE_W / 2;
const isoY = (x, y) => (x + y) * TILE_H / 2;

// границы всей карты в экранных координатах (для камеры)
const MAP_MIN_X = -MAP_H * TILE_W / 2, MAP_MAX_X = MAP_W * TILE_W / 2;
const MAP_MIN_Y = 0, MAP_MAX_Y = (MAP_W + MAP_H - 2) * TILE_H / 2 + WALL_H;
const clamp = (v, a, b) => Math.max(Math.min(a, b), Math.min(Math.max(a, b), v));

function diamond(x, y, h) {
  const sx = isoX(x, y), sy = isoY(x, y) - (h || 0);
  ctx.beginPath();
  ctx.moveTo(sx, sy - TILE_H / 2);
  ctx.lineTo(sx + TILE_W / 2, sy);
  ctx.lineTo(sx, sy + TILE_H / 2);
  ctx.lineTo(sx - TILE_W / 2, sy);
  ctx.closePath();
}

function drawFloor() {
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++) {
      const c = tileAt(x, y);
      if (c === "#") continue;
      diamond(x, y);
      ctx.fillStyle = (x + y) % 2 ? "#d8c096" : "#e3cda6";
      ctx.fill();
      ctx.strokeStyle = "rgba(120,90,50,.25)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  // ковёр у центра класса
  ctx.fillStyle = "rgba(90,140,200,.28)";
  for (let y = 4; y <= 6; y++)
    for (let x = 7; x <= 10; x++) { diamond(x, y); ctx.fill(); }
}

function drawWallBox(x, y, h) {
  const H = h == null ? WALL_H : h;
  const sx = isoX(x, y), sy = isoY(x, y);
  const hw = TILE_W / 2, hh = TILE_H / 2;
  // левая грань
  ctx.fillStyle = "#8f6f4e";
  ctx.beginPath();
  ctx.moveTo(sx - hw, sy); ctx.lineTo(sx, sy + hh);
  ctx.lineTo(sx, sy + hh - H); ctx.lineTo(sx - hw, sy - H);
  ctx.closePath(); ctx.fill();
  // правая грань
  ctx.fillStyle = "#a5825d";
  ctx.beginPath();
  ctx.moveTo(sx + hw, sy); ctx.lineTo(sx, sy + hh);
  ctx.lineTo(sx, sy + hh - H); ctx.lineTo(sx + hw, sy - H);
  ctx.closePath(); ctx.fill();
  // верх
  ctx.fillStyle = "#c9a877";
  ctx.beginPath();
  ctx.moveTo(sx, sy - hh - H); ctx.lineTo(sx + hw, sy - H);
  ctx.lineTo(sx, sy + hh - H); ctx.lineTo(sx - hw, sy - H);
  ctx.closePath(); ctx.fill();
}

// низкие «губы» вместо полных стен со стороны камеры — чтобы не закрывали героев
const LIP_H = 16;
const wallHeightAt = (x, y) =>
  (x === MAP_W - 1 || y === MAP_H - 1) ? LIP_H : WALL_H;

function drawDoor(x, y, t) {
  const sx = isoX(x, y), sy = isoY(x, y);
  diamond(x, y);
  ctx.fillStyle = doorOpen ? "#7fd08a" : "#7a5a38";
  ctx.fill();
  if (doorOpen) {
    ctx.save();
    ctx.globalAlpha = .5 + .3 * Math.sin(t * 4);
    ctx.strokeStyle = "#b6ffbe"; ctx.lineWidth = 3;
    diamond(x, y); ctx.stroke();
    ctx.restore();
    label(sx, sy - wallHeightAt(x, y) - 22, "ВЫХОД", "#b6ffbe");
  } else {
    label(sx, sy - wallHeightAt(x, y) - 22, "🔒", "#fff");
  }
}

function label(x, y, text, color) {
  ctx.save();
  ctx.font = "bold 15px system-ui";
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.fillText(text, x + 1, y + 1);
  ctx.fillStyle = color || "#fff";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawSprite(img, x, y, w, h, flip, bobY) {
  const sx = isoX(x, y), sy = isoY(x, y) - (bobY || 0);
  // мягкая тень под ногами
  ctx.fillStyle = "rgba(40,25,10,.22)";
  ctx.beginPath();
  ctx.ellipse(sx, sy, w * .3, w * .13, 0, 0, 6.29);
  ctx.fill();
  ctx.save();
  ctx.translate(sx, sy);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -w / 2, -h, w, h);
  ctx.restore();
}

function drawBlackboard() {
  // доска висит на плоскости северной стены (не «летает»):
  // верх стены в изометрии — линия y = X/2 - WALL_H, доска повёрнута в эту плоскость
  const cx = 8.5, sx = isoX(cx, 0);
  const W = 190, H = 46, X0 = sx - W / 2;
  const Y0 = X0 / 2 - WALL_H + 8;      // низ доски с нахлёстом на стену
  ctx.save();
  ctx.transform(0.8944, 0.4472, 0, -1, X0, Y0);
  ctx.fillStyle = "#c9a877";                    // рама
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#2e5d43";
  ctx.fillRect(4, 4, W - 8, H - 8);
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.font = "21px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.save();
  ctx.translate(W / 2, H / 2);   // основной transform отражает Y — вернём текст «ногами вниз»
  ctx.scale(1, -1);
  ctx.fillText("2 + 2 = 4    3 + 3 = 6", 0, 0);
  ctx.restore();
  ctx.restore();
}

/* ---------- звук ---------- */
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function tone(f, t0, dur, type, vol) {
  if (muted) return;
  const ac = audio(), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0, ac.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol || .15, ac.currentTime + t0 + .01);
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .05);
}
const sfxCollect = () => { tone(660, 0, .12, "triangle"); tone(880, .09, .15, "triangle"); };
const sfxWin = () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .14, .3, "triangle", .18)); };
const sfxClick = () => tone(440, 0, .06, "square", .06);

/* ---------- ввод ---------- */
const keys = {};
addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "p") togglePause();
  if (e.key === " ") {
    if (state === "title" || state === "win") startGame();
    else if (state === "pause") togglePause();
  }
  if ((e.key.toLowerCase() === "e" || e.key === "Enter") && state === "play" && !quizOpen && nearDesk) {
    e.preventDefault(); openQuiz(nearDesk);
  }
});
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

const joy = { active: false, id: -1, dx: 0, dy: 0 };
const joyEl = document.getElementById("joy"), stickEl = document.getElementById("stick");
if ("ontouchstart" in window) joyEl.style.display = "block";
joyEl.addEventListener("pointerdown", e => { joy.active = true; joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); moveStick(e); });
joyEl.addEventListener("pointermove", e => { if (joy.active && e.pointerId === joy.id) moveStick(e); });
const joyEnd = e => { if (e.pointerId === joy.id) { joy.active = false; joy.dx = joy.dy = 0; stickEl.style.left = "41px"; stickEl.style.top = "41px"; } };
joyEl.addEventListener("pointerup", joyEnd);
joyEl.addEventListener("pointercancel", joyEnd);
function moveStick(e) {
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const m = Math.hypot(dx, dy), max = r.width / 2 - 14;
  if (m > max) { dx *= max / m; dy *= max / m; }
  joy.dx = dx / max; joy.dy = dy / max;
  stickEl.style.left = (41 + dx) + "px"; stickEl.style.top = (41 + dy) + "px";
}

function inputVec() {
  let x = 0, y = 0;
  if (keys["a"] || keys["arrowleft"])  x -= 1;
  if (keys["d"] || keys["arrowright"]) x += 1;
  if (keys["w"] || keys["arrowup"])    y -= 1;
  if (keys["s"] || keys["arrowdown"])  y += 1;
  x += joy.dx; y += joy.dy;
  // экранные направления -> тайловые (изометрия)
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  const tx = x + y, ty = y - x;   // поворот осей на 45°
  const tl = Math.hypot(tx, ty) || 1;
  return { x: tx / tl, y: ty / tl, active: len > .15 };
}

/* ---------- UI ---------- */
const overlay = document.getElementById("overlay"), ovTitle = document.getElementById("ovTitle"),
      ovText = document.getElementById("ovText"), ovHint = document.getElementById("ovHint"),
      ovBtn = document.getElementById("ovBtn"), booksEl = document.getElementById("books"),
      timerEl = document.getElementById("timer");

function showOverlay(title, text, btn, hint) {
  ovTitle.textContent = title; ovText.innerHTML = text;
  ovBtn.textContent = btn;
  ovHint.style.display = hint ? "" : "none";
  if (hint) ovHint.textContent = hint;
  overlay.classList.remove("hidden");
}
function hideOverlay() { overlay.classList.add("hidden"); }

ovBtn.addEventListener("click", () => {
  sfxClick();
  if (state === "title" || state === "win") startGame();
  else if (state === "pause") togglePause();
});
document.getElementById("pause").addEventListener("click", () => { sfxClick(); togglePause(); });
document.getElementById("mute").addEventListener("click", function () {
  muted = !muted; localStorage.setItem("sq_iso_mute", muted ? "1" : "0");
  this.textContent = muted ? "🔇" : "🔊";
});
document.getElementById("mute").textContent = muted ? "🔇" : "🔊";

function updateBooksHud() { booksEl.textContent = "✅ " + desks.filter(d => d.done).length + "/" + TOTAL; }

/* ---------- задания (математика, 1 класс) ----------
   формат вопроса: [вопрос, верный ответ, [3 неверных], объяснение] */
const pick = a => a[Math.floor(Math.random() * a.length)];
const r2 = n => Math.floor(Math.random() * n);
function wrongNums(r) {
  const w = new Set(); let guard = 0;
  while (w.size < 3 && guard++ < 60) {
    const c = r + pick([-10, -3, -2, -1, 1, 2, 3, 10]);
    if (c >= 0 && c !== r) w.add(String(c));
  }
  while (w.size < 3) w.add(String(r + w.size + 7));
  return [...w];
}
function makeQ() {
  const t = r2(6);
  if (t === 0) { const a = 2 + r2(13), b = 2 + r2(9), r = a + b;
    return [a + " + " + b + " = ?", String(r), wrongNums(r), a + " плюс " + b + " будет " + r + "."]; }
  if (t === 1) { const a = 8 + r2(12), b = 1 + r2(a - 1), r = a - b;
    return [a + " − " + b + " = ?", String(r), wrongNums(r), a + " минус " + b + " будет " + r + "."]; }
  if (t === 2) { const a = 2 + r2(4), b = 2 + r2(4), r = a * b;
    return [a + " × " + b + " = ?", String(r), wrongNums(r), a + " умножить на " + b + " будет " + r + "."]; }
  if (t === 3) { const a = 5 + r2(16), b = 5 + r2(16);
    if (a === b) return makeQ();
    const big = Math.max(a, b), small = Math.min(a, b);
    return ["Какое число больше: " + a + " или " + b + "?", String(big), wrongNums(big), "Сравниваем: " + big + " больше, чем " + small + "."]; }
  if (t === 4) { const start = 2 + r2(6), r = start + 6;
    return ["Продолжи ряд: " + start + ", " + (start + 2) + ", " + (start + 4) + ", __",
      String(r), wrongNums(r), "Каждое число больше предыдущего на 2, значит " + (start + 4) + " + 2 = " + r + "."]; }
  const a = 2 + r2(9), b = 2 + r2(9), r = a + b;
  return ["У Миши " + a + " наклеек, у Гриши " + b + ". Сколько наклеек у них вместе?",
    String(r), wrongNums(r), "Складываем: " + a + " + " + b + " = " + r + "."];
}
const usedQ = new Set();
function genQ() {
  for (let i = 0; i < 80; i++) { const q = makeQ(); if (!usedQ.has(q[0])) { usedQ.add(q[0]); return q; } }
  return makeQ();
}

let nearDesk = null, quizOpen = false, curDesk = null, curQ = null;
const quizEl = document.getElementById("quiz"), qText = document.getElementById("qText"),
      qOpts = document.getElementById("qOpts"), qExpl = document.getElementById("qExpl"),
      qNext = document.getElementById("qNext"), actionBtn = document.getElementById("action");

function openQuiz(d) {
  if (quizOpen || d.done) return;
  curDesk = d; quizOpen = true;
  hero.x = d.x; hero.y = d.y + .55; hero.moving = false;   // герой встаёт у парты (южная сторона — всегда проходимый пол)
  cat.trail.length = 0; cat.trail.push({ x: hero.x, y: hero.y });
  curQ = genQ();
  qText.textContent = curQ[0];
  qExpl.classList.add("hidden"); qNext.classList.add("hidden");
  const opts = [curQ[1], ...curQ[2]];
  for (let i = opts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
  qOpts.innerHTML = "";
  const btns = opts.map(o => {
    const b = document.createElement("button");
    b.className = "bigbtn"; b.style.cssText = "font-size:20px;padding:12px 10px;margin:0;box-shadow:0 4px 0 #b97e00;";
    b.textContent = o;
    b.addEventListener("click", () => answerQ(o, b, btns));
    qOpts.appendChild(b);
    return b;
  });
  actionBtn.classList.add("hidden");
  quizEl.classList.remove("hidden");
  sfxClick();
}
function answerQ(chosen, btn, btns) {
  const right = chosen === curQ[1];
  btns.forEach(b => {
    b.disabled = true;
    if (b.textContent === curQ[1]) { b.style.background = "#69c96f"; b.style.color = "#0c2b0e"; b.style.boxShadow = "0 4px 0 #3d8a43"; }
    else if (b === btn) { b.style.background = "#e0605e"; b.style.color = "#3b0d0c"; b.style.boxShadow = "0 4px 0 #9e3736"; }
    else b.style.opacity = ".45";
  });
  qExpl.textContent = (right ? "✅ Верно! " : "❌ Пока нет. ") + curQ[3];
  qExpl.classList.remove("hidden"); qNext.classList.remove("hidden");
  if (right) {
    curDesk.done = true; sfxCollect(); burst(curDesk.x, curDesk.y, "#7fd08a"); updateBooksHud();
    if (desks.every(k => k.done)) { doorOpen = true; burst(hero.x, hero.y, "#7fd08a"); }
  } else {
    tone(220, 0, .22, "sawtooth", .08);
  }
}
qNext.addEventListener("click", () => { quizOpen = false; quizEl.classList.add("hidden"); sfxClick(); });
actionBtn.addEventListener("click", () => { if (nearDesk) openQuiz(nearDesk); });
function fmt(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ":" + String(s).padStart(2, "0"); }

function startGame() { resetGame(); state = "play"; startT = performance.now(); hideOverlay(); }
function togglePause() {
  if (state === "play") { state = "pause"; showOverlay("Пауза", "Отдохни, школьник! 📖", "Продолжить", ""); }
  else if (state === "pause") { state = "play"; hideOverlay(); }
}
function winGame() {
  state = "win";
  const t = elapsed;
  let rec = "";
  if (!best || t < best) { best = t; localStorage.setItem("sq_iso_best", String(best)); rec = " 🏆 Новый рекорд!"; }
  sfxWin();
  showOverlay("Победа! 🎉",
    "Все 12 заданий по математике сданы, урок окончен!<br>Время: <b>" + fmt(t) + "</b>" + rec +
    (best ? "<br>Лучшее время: <b>" + fmt(best) + "</b>" : ""),
    "Играть ещё", "Или нажми Пробел");
}

/* ---------- частицы ---------- */
function burst(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * 6.28, sp = 40 + Math.random() * 70;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: .7, color });
  }
}

/* ---------- обновление ---------- */
const SPEED = 3.4;
function update(dt, t) {
  if (state !== "play") return;
  elapsed = (performance.now() - startT) / 1000;

  const iv = quizOpen ? { x: 0, y: 0, active: false } : inputVec();
  hero.moving = iv.active;
  if (iv.active) {
    hero.face = (iv.x - iv.y) < 0 ? -1 : 1;
    const nx = hero.x + iv.x * SPEED * dt, ny = hero.y + iv.y * SPEED * dt;
    // скольжение вдоль стен
    if (passable(nx, hero.y, doorOpen)) hero.x = nx;
    if (passable(hero.x, ny, doorOpen)) hero.y = ny;
    hero.bob += dt * 10;
  }

  // кот следует по следу
  cat.trail.push({ x: hero.x, y: hero.y });
  if (cat.trail.length > 26) cat.trail.shift();
  const tgt = cat.trail[0];
  const ddx = tgt.x - cat.x, ddy = tgt.y - cat.y, dd = Math.hypot(ddx, ddy);
  if (dd > .02) {
    const sp = Math.min(dd, SPEED * .92 * dt);
    cat.x += ddx / dd * sp; cat.y += ddy / dd * sp;
    cat.face = (ddx - ddy) < 0 ? -1 : 1;
    cat.bob += dt * 12;
  }

  // парта рядом → показать кнопку «Начать задание»
  nearDesk = null;
  if (!quizOpen) {
    let best = 1.15;
    for (const d of desks) {
      if (d.done) continue;
      const dist = Math.hypot(d.x - hero.x, d.y - hero.y);
      if (dist < best) { best = dist; nearDesk = d; }
    }
  }
  actionBtn.classList.toggle("hidden", !(nearDesk && state === "play" && !quizOpen));

  // выход
  if (doorOpen && tileAt(Math.floor(hero.x), Math.floor(hero.y)) === "D") winGame();

  // частицы
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt; p.x += p.vx * dt / 32; p.y += p.vy * dt / 32; p.vy += 180 * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }

  // камера: класс меньше экрана — держим строго по центру;
  // если экран мал — следуем за героем, не выпуская класс за края
  const mapW = MAP_MAX_X - MAP_MIN_X, mapH = MAP_MAX_Y - MAP_MIN_Y;
  const tx = mapW <= innerWidth ? (innerWidth - MAP_MIN_X - MAP_MAX_X) / 2
           : clamp(innerWidth / 2 - isoX(hero.x, hero.y), innerWidth - MAP_MAX_X, -MAP_MIN_X);
  const ty = mapH <= innerHeight - 60 ? (innerHeight - 60 - MAP_MIN_Y - MAP_MAX_Y) / 2 + 60
           : clamp(innerHeight / 2 - isoY(hero.x, hero.y) + 20, innerHeight - MAP_MAX_Y, 60 - MAP_MIN_Y);
  camX += (tx - camX) * Math.min(1, dt * 6);
  camY += (ty - camY) * Math.min(1, dt * 6);
}

/* ---------- отрисовка ---------- */
const IMG = {};
async function loadSprites() {
  await Promise.all(Object.entries(SPRITES).map(async ([k, [base, n]]) => {
    try {
      const parts = await Promise.all(Array.from({ length: n }, (_, i) =>
        fetch(base + String(i).padStart(3, "0") + ".b64").then(r => {
          if (!r.ok) throw new Error("chunk " + i);
          return r.text();
        })));
      const im = new Image();
      await new Promise(res => { im.onload = res; im.onerror = res; im.src = "data:image/png;base64," + parts.join(""); });
      if (im.width) IMG[k] = im;
    } catch (e) { /* спрайт не загрузился — игра продолжит без него */ }
  }));
}

function render(t) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.save();
  ctx.translate(camX, camY);
  drawFloor();

  // список отрисовки с глубиной
  const items = [];
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++) {
      const c = tileAt(x, y);
      if (c === "#") items.push({ d: x + y, f: () => drawWallBox(x, y, wallHeightAt(x, y)) });
      else if (c === "D") items.push({ d: x + y, f: () => drawDoor(x, y, t) });
      else if (c === "T" && IMG.desk) items.push({ d: x + y + .4, f: () => drawSprite(IMG.desk, x + .5, y + .5, 92, 92) });
      else if (c === "S" && IMG.shelf) items.push({ d: x + y + .4, f: () => drawSprite(IMG.shelf, x + .5, y + .5, 100, 116) });
    }
  // галочка над сданной партой
  for (const d of desks)
    if (d.done) items.push({ d: d.x + d.y + .2, f: () => label(isoX(d.x, d.y), isoY(d.x, d.y) - 96, "✅", "#b6ffbe") });
  if (IMG.cat) items.push({ d: cat.x + cat.y + .6, f: () => drawSprite(IMG.cat, cat.x, cat.y, 62, 62, cat.face === -1, Math.abs(Math.sin(cat.bob)) * 3) });
  if (IMG.hero) items.push({ d: hero.x + hero.y + .7, f: () => drawSprite(IMG.hero, hero.x, hero.y, 74, 74, hero.face === -1, hero.moving ? Math.abs(Math.sin(hero.bob)) * 5 : 0) });

  items.sort((a, b) => a.d - b.d);
  for (const it of items) it.f();

  // частицы
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / .7);
    ctx.fillStyle = p.color;
    const sx = isoX(p.x, p.y), sy = isoY(p.x, p.y) - 10;
    ctx.beginPath(); ctx.arc(sx, sy, 3, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawBlackboard();
  ctx.restore();

  // HUD таймер
  if (state === "play") timerEl.textContent = fmt(elapsed);
}

/* ---------- цикл ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt, now / 1000);
  render(now / 1000);
  requestAnimationFrame(loop);
}

/* ---------- запуск ---------- */
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();
resetGame();
// стартовая камера (сразу по центру класса, без «пролёта»)
{
  const mapW = MAP_MAX_X - MAP_MIN_X, mapH = MAP_MAX_Y - MAP_MIN_Y;
  camX = mapW <= innerWidth ? (innerWidth - MAP_MIN_X - MAP_MAX_X) / 2
       : clamp(innerWidth / 2 - isoX(hero.x, hero.y), innerWidth - MAP_MAX_X, -MAP_MIN_X);
  camY = mapH <= innerHeight - 60 ? (innerHeight - 60 - MAP_MIN_Y - MAP_MAX_Y) / 2 + 60
       : clamp(innerHeight / 2 - isoY(hero.x, hero.y) + 20, innerHeight - MAP_MAX_Y, 60 - MAP_MIN_Y);
}
loadSprites().then(() => requestAnimationFrame(loop));
</script>
</body>
